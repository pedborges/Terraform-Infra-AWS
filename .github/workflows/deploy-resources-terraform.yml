name: "Terraform Workflow"

on:
    workflow_call:
      inputs:
        environment:
          required: true
          type: string
        aws-assume-role-arn:
          required: true
          type: string
        aws-statefile-s3-bucket:
          required: true
          type: string
        aws-lock-dynamodb-table:
          required: true
          type: string
        aws-region: 
            required: true
            type: string            
jobs:
    terraform:
        runs-on: ubuntu-latest
        defaults:
          run:
            shell: bash
        steps:
            - name: Checkout code test
              uses: actions/checkout@v4   # git clone e checkout do código

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3 #configura o terraform
              with:
                    terraform_version: 1.8.3

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v2 #configura as credenciais aws
              with:
                  role-to-assume: ${{ inputs.aws-assume-role-arn }}
                  aws-region: ${{ inputs.aws-region }}

           

            - name: Initialize Terraform
              run: cd Infra && terraform init -backend-config="bucket=${{ inputs.aws-statefile-s3-bucket }}" -backend-config="dynamodb_table=${{inputs.aws-lock-dynamodb-table}}" -backend-config="key=${{github.event.repository.name}}" -backend-config="region=${{inputs.aws-region}}"

            - name: Validate Terraform Configuration
              run:  terraform validate

            - name: Plan Terraform Changes
              id: terraform-plan
              run: cd Infra && terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} && terraform plan -var-file="envs/${{inputs.environment}}/terraform.tfvars" -out="${{inputs.environment}}.plan"

            - name: Apply Terraform Configuration
              id: terraform-apply
              run: cd Infra && terraform workspace select ${{ inputs.environment }}|| terraform workspace new ${{ inputs.environment }} && terraform apply "${{inputs.environment}}.plan"